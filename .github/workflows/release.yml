name: Release

# Push a tag that matches versionName (for example v1.3) to build, sign and publish a release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${{ steps.version.outputs.name }} in app/build.gradle.kts"
            exit 1
          fi

      # Without keystore.properties the build falls back to the debug key, so stop instead
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release-key.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK and AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p dist
          BASE="Al-Minshawi-v${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/$BASE.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/$BASE.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Al-Minshawi-v${{ steps.version.outputs.name }}
          path: dist/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Al-Minshawi v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: dist/*

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.jks" keystore.properties
